<p-confirmdialog></p-confirmdialog>
<div class="mg-page">
  <div class="mg-header">
    <p-button (onClick)="backClick()" icon="fa-solid fa-chevron-left" severity="secondary"></p-button>
    <div class="mg-title">Hello, {{user.name}}</div>
  </div>

  <div class="mg-section">Your games</div>

  @for (game of games; track game) {
    <div class="mg-game-card" style="cursor:pointer;" (click)="openGame(game)" title="Open game">
      <div class="mg-game-name">{{game.name}}</div>
      <span class="mg-badge">{{game.gameType}}</span>
      <span class="mg-badge play">{{game.gameStatus}}</span>
      @if (endedResult(game)) {
        <span class="mg-badge" style="background:#fef9c3;color:#854d0e;">
          <i class="pi pi-trophy" style="margin-right:5px;"></i>{{ endedResult(game) }}
        </span>
      }
      <span style="color:var(--mg-muted);font-size:13px;margin-left:6px;">{{ playersLabel(game) }}</span>
      <div class="mg-spacer"></div>
      <!-- buttons stop the click from bubbling to the card so they don't open the game -->
      <div class="mg-row-center" style="gap:8px;" (click)="$event.stopPropagation()">
        <p-button (onClick)="setup(game)" severity="warn" label="Settings" icon="pi pi-cog"></p-button>
        <p-button (onClick)="delete(game)" severity="danger" label="Delete" icon="pi pi-trash"></p-button>
      </div>
    </div>
  }

  <div class="mg-section">Create a game</div>
  <div class="mg-row-center" style="column-gap: 12px;">
    <p-button (onClick)="createGame('TIK_TAK_TOE')" label="Tic-Tac-Toe" icon="pi pi-th-large"></p-button>
    <p-button (onClick)="createGame('CHESS')" label="Chess" icon="pi pi-flag"></p-button>
    <p-button (onClick)="createGame('GOMOKU')" label="Gomoku" icon="pi pi-circle-fill"></p-button>
    <p-button (onClick)="createGame('REVERSI')" label="Reversi" icon="pi pi-circle"></p-button>
    <p-button (onClick)="createGame('CHECKERS')" label="Checkers" icon="pi pi-star"></p-button>
    <p-button (onClick)="createGame('DND')" label="D&D" icon="pi pi-compass"></p-button>
    <p-button (onClick)="createGame('DURAK')" label="Durak" icon="pi pi-clone"></p-button>
  </div>
</div>
