<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="200" fill="#6aa84f"/>
  <!-- a little tiled map -->
  <g stroke="#3f6a2a" stroke-width="2">
    <rect x="70" y="40" width="60" height="60" fill="#c8a56b"/>
    <rect x="130" y="40" width="60" height="60" fill="#6aa84f"/>
    <rect x="190" y="40" width="60" height="60" fill="#c8a56b"/>
    <rect x="70" y="100" width="60" height="60" fill="#6aa84f"/>
    <rect x="130" y="100" width="60" height="60" fill="#6aa84f"/>
    <rect x="190" y="100" width="60" height="60" fill="#6aa84f"/>
  </g>
  <!-- road down the middle column -->
  <g stroke="#eee8d5" stroke-width="10" stroke-linecap="round">
    <path d="M160 40 V160"/>
    <path d="M130 130 H250"/>
  </g>
  <!-- city walls -->
  <rect x="70" y="40" width="60" height="14" fill="#8a6d3b"/>
  <rect x="190" y="40" width="60" height="14" fill="#8a6d3b"/>
  <!-- meeples -->
  <circle cx="160" cy="130" r="9" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
  <circle cx="100" cy="70" r="9" fill="#2563eb" stroke="#0b1220" stroke-width="2"/>
  <text x="160" y="185" font-family="Georgia, serif" font-size="20" font-weight="800" fill="#26350f" text-anchor="middle" letter-spacing="1">CARCASSONNE</text>
</svg>
